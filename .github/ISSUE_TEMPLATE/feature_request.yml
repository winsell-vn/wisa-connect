name: Feature request
description: Propose a new capability or a change to an existing one.
title: "[feat] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is the current behaviour, and why does it get in the way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change. Include the UI flow or the config shape if you have them in mind.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Small — renderer only
        - Medium — renderer and Rust
        - Large — architectural change
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
