name: Release WISA Connect

# Builds the WISA Connect desktop app (Tauri v2) for Windows and macOS and
# attaches the installers to a GitHub Release.
#
# Manual only. A desktop release is a decision, not a side effect of pushing a
# tag: a stray tag that starts a build nobody asked for burns runner time and
# leaves a red X on the release commit.
#
# Secrets:
#   TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]   signs the auto-update payloads
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, R2_BUCKET
#                                          publishes to assets.winsell.vn
#   WINDOWS_CERTIFICATE[_PASSWORD]         Authenticode, when a cert exists
#   APPLE_*                                signing and notarisation, when a cert exists
#
# Not wired yet: uploading to Cloudflare R2 / assets.winsell.vn. The Tauri
# updater endpoint in src-tauri/tauri.conf.json points there, so auto-update
# only works once the artifacts and latest.json are published to that bucket.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and tag (e.g. 0.1.0)"
        required: true
        type: string
      release_notes:
        description: "Release notes"
        required: false
        default: "Bản phát hành WISA Connect."
        type: string

permissions:
  contents: write

concurrency:
  group: wisa-connect-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    steps:
      - uses: actions/checkout@v4

      # No `version` here: package.json pins `packageManager: pnpm@10.12.3` and
      # the action refuses to run when both are set.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # An unsigned build produces installers that cannot auto-update, and an
      # updater key that does not match the committed pubkey produces installers
      # that every client refuses. Fail loudly instead of shipping either.
      - name: Require updater signing key
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set — auto-update would be dead on arrival."
            exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p release-artifacts
          bundle="src-tauri/target/release/bundle"
          # *.tar.gz carries the macOS updater payload; *.nsis.zip and *.msi.zip
          # carry the Windows ones. They are covered by *.zip only for the latter.
          find "$bundle" -type f \
            \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.zip" \
               -o -name "*.tar.gz" -o -name "*.sig" \) \
            -exec cp {} release-artifacts/ \;
          ls -la release-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: wisa-connect-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      # Tauri writes a .sig per updater artifact but not latest.json itself.
      # Building it here means the GitHub Release and the R2 mirror ship the
      # same manifest instead of two hand-written copies.
      - name: Generate updater manifest
        run: |
          node scripts/generate-updater-manifest.mjs release-artifacts "v${{ inputs.version }}" \
            --notes "${{ inputs.release_notes }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: WISA Connect v${{ inputs.version }}
          body: ${{ inputs.release_notes }}
          draft: true
          files: release-artifacts/*

      # Mirrors the same artifacts to the host the app's updater polls. Skipped
      # (not failed) when the R2 credentials are absent, so a first release can
      # still produce installers before the bucket is wired up.
      - name: Publish to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${R2_BUCKET:-}" ]; then
            echo "::notice::R2 secrets not configured — skipping mirror upload."
            exit 0
          fi
          npm install -g wrangler
          node scripts/publish-r2-release.mjs release-artifacts "v${{ inputs.version }}" --bucket "$R2_BUCKET"
